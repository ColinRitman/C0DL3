version: '3.8'

services:
  c0dl3-node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "9944:9944"    # RPC + Explorer
      - "30333:30333"  # P2P
    environment:
      - RUST_LOG=info
    volumes:
      - c0dl3-data:/app/data
    restart: unless-stopped
    # Override CMD for live settlement mode:
    # command: [
    #   "--data-dir", "/app/data",
    #   "--rpc-port", "9944",
    #   "--p2p-port", "30333",
    #   "--hyperchain-id", "789779",
    #   "--era-rpc-url", "https://sepolia.era.zksync.dev",
    #   "--settlement-contract", "0xYOUR_CONTRACT",
    #   "--sequencer-key", "YOUR_PRIVATE_KEY_HEX"
    # ]

  # Optional monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  c0dl3-data:
