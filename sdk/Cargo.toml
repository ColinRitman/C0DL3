[package]
name = "coldl3-sdk"
version = "0.1.0"
edition = "2021"
description = "COLDL3 wallet SDK — client-side privacy proof generation"
license = "MIT"

[dependencies]
curve25519-dalek-ng = { version = "4.1", features = ["u64_backend"] }
bulletproofs = "4.0"
merlin = "3.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
anyhow = "1.0"
once_cell = "1.19"

[dev-dependencies]
rand = "0.8"
