[package]
name = "coldl3-sp1-guest"
version = "0.1.0"
edition = "2021"
description = "SP1 guest program for zkC0DL3 — proves EVM execution + privacy validation"

[[bin]]
name = "coldl3-sp1-guest"
path = "src/main.rs"

# Build with: cd program && cargo prove build
# Requires SP1 toolchain: curl -L https://sp1.succinct.xyz | bash && sp1up

[dependencies]
# SP1 zkVM guest runtime (provides entrypoint!, io::read/commit, precompile syscalls)
sp1-zkvm = "6.0"

# EVM execution engine — patched by sp1-patches to accelerate keccak256/sha2 via SP1 syscalls
revm = { version = "14", default-features = false, features = ["std"] }

# Ristretto255 + Pedersen — patched by sp1-patches for SP1 curve25519 acceleration
# bulletproofs 4.0 depends on curve25519-dalek-ng internally (not regular dalek)
curve25519-dalek-ng = { version = "4.1", features = ["u64_backend"] }
bulletproofs = "4.0"   # range proof verification; uses curve25519-dalek-ng
merlin = "3.0"         # transcript for bulletproofs

sha2 = "0.10"          # SHA-256 — patched via sp1-patches for SP1 SHA-256 precompile
sha3 = "0.10"          # Keccak256 — for ecRecover address derivation (0x0001)
k256 = { version = "0.13", features = ["ecdsa"] }    # secp256k1 ECDSA — ecRecover (0x0001)
ed25519-consensus = "2.1"                             # Ed25519 verify — 0x0140 (HEAT/COLD + bridge)
num-bigint = "0.4"     # arbitrary-precision integers — ModExp (0x0005)
substrate-bn = "0.6"   # BN254 elliptic curve — ecAdd/ecMul/ecPairing (0x0006/0x0007/0x0008)
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"        # compact binary serialization for SP1 stdin/stdout

[patch.crates-io]
# SP1-patched crates accelerate hot crypto ops via SP1 precompile syscalls.
# These are drop-in replacements — same API, much fewer RISC-V cycles inside the zkVM.
# Approach: patch underlying crypto crates, NOT revm itself (following RSP pattern).
#
# Tags follow format: patch-{crate-version}-sp1-{sp1-version}
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
curve25519-dalek-ng = { git = "https://github.com/sp1-patches/curve25519-dalek-ng", branch = "patch-v4.1.1" }
# Secp256k1 — for ecRecover (Ethereum precompile 0x0001)
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
# BLS12-381 — patch registered, no precompile yet (reserved 0x0160-0x0163)
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0" }
